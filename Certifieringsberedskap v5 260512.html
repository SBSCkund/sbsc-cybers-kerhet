<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Förberedelsverktyg inför SBSC-certifiering enligt SSF 1101 Cybersäkerhet Basnivå.">
<title>SBSC — SSF 1101 Cybersäkerhet Basnivå</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --amber:#FFA300;--black:#101820;--white:#fff;--page:#F8F9FA;
  --border:#E8E9EC;--muted:#6B6C74;--faint:#F2F3F5;
  --green:#1B6B3F;--red:#C03535;--blue:#2A5A8C;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07);--r:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:"Open Sans",system-ui,sans-serif;background:var(--page);color:var(--black);line-height:1.6;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
button:disabled{opacity:.38;cursor:not-allowed;}

.site-header{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.site-header::after{content:"";display:block;height:3px;background:var(--amber);}
.hdr-inner{max-width:960px;margin:0 auto;padding:0 32px;height:72px;display:flex;align-items:center;justify-content:space-between;}
.hdr-logo{height:56px;width:auto;}
.hdr-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;}

.shell{max-width:860px;margin:0 auto;padding:40px 24px 80px;}
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--border);padding:28px;margin-bottom:14px;box-shadow:var(--shadow-sm);}

.page-intro{text-align:center;padding:0 0 28px;}
.chip{display:inline-block;background:var(--amber);color:var(--black);font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:5px 14px;border-radius:2px;margin-bottom:16px;}
.page-intro h1{font-size:28px;font-weight:800;line-height:1.2;letter-spacing:-.5px;margin-bottom:10px;}
.page-intro p{font-size:15px;color:var(--muted);max-width:500px;margin:0 auto;}

/* SSF DOWNLOAD BOX */
.ssf-download-box{background:var(--white);border:1px solid var(--border);border-left:4px solid var(--amber);border-radius:var(--r);padding:18px 22px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;box-shadow:var(--shadow-sm);}
.ssf-download-text{}
.ssf-download-title{font-size:14px;font-weight:800;color:var(--black);margin-bottom:4px;}
.ssf-download-body{font-size:12px;color:var(--muted);line-height:1.6;max-width:440px;}
.ssf-download-btn{display:inline-flex;align-items:center;gap:7px;background:var(--amber);color:var(--black);padding:10px 18px;font-size:12px;font-weight:800;border-radius:4px;white-space:nowrap;font-family:inherit;text-decoration:none;transition:background .12s;flex-shrink:0;}
.ssf-download-btn:hover{background:#E89300;}

/* INFO BOX — startsida */
.info-box{background:#F0F7FF;border:1.5px solid #C8DCF0;border-radius:var(--r);padding:22px 24px;margin-bottom:20px;}
.info-box-title{font-size:14px;font-weight:800;color:var(--black);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.info-box-body{font-size:13px;color:#1a3a5c;line-height:1.7;margin-bottom:14px;}
.info-warn-head{font-size:13px;font-weight:800;color:#7A3800;margin-bottom:8px;display:flex;align-items:center;gap:7px;padding-top:12px;border-top:1px solid #C8DCF0;}
.steps-list{list-style:none;padding:0;margin:0 0 10px;}
.steps-list li{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:#1a3a5c;margin-bottom:7px;line-height:1.5;}
.step-num{flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--amber);color:var(--black);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.info-note{font-size:12px;color:#4a6080;border-top:1px solid #C8DCF0;padding-top:10px;margin-top:10px;line-height:1.6;}

.field-label{font-size:13px;font-weight:700;color:var(--black);margin-bottom:8px;}
.req-star{color:var(--red);font-size:16px;line-height:1;}
.text-input{width:100%;padding:12px 15px;font-size:15px;font-weight:600;font-family:inherit;border:1.5px solid var(--border);border-radius:6px;outline:none;transition:border-color .15s,box-shadow .15s;}
.text-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,163,0,.14);}

.privacy-note{display:flex;align-items:flex-start;gap:10px;background:#EEF4FB;border:1px solid #C8DCF0;border-radius:6px;padding:12px 14px;margin-top:14px;}
.privacy-note p{font-size:12px;color:var(--blue);font-weight:500;line-height:1.55;}

.disc-check-wrap{display:flex;align-items:flex-start;gap:12px;padding:16px;background:var(--faint);border:1.5px solid var(--border);border-radius:6px;margin-top:14px;cursor:pointer;transition:border-color .12s;}
.disc-check-wrap:hover{border-color:var(--amber);}
.disc-checkbox{width:22px;height:22px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;transition:all .12s;background:var(--white);}
.disc-checked{background:var(--amber)!important;border-color:var(--amber)!important;color:var(--black)!important;}
.disc-check-text{font-size:12px;color:var(--black);line-height:1.6;}
.disc-check-text strong{display:block;font-size:13px;font-weight:800;margin-bottom:4px;}

.stat-row{display:flex;gap:10px;margin-top:18px;}
.stat{flex:1;background:var(--faint);border-radius:6px;padding:12px 14px;text-align:center;}
.stat-n{font-size:18px;font-weight:800;}
.stat-l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

.btn-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;}
.btn{padding:11px 24px;font-size:13px;font-weight:700;border-radius:4px;cursor:pointer;font-family:inherit;transition:all .12s;border:2px solid transparent;}
.btn-primary{background:var(--amber);color:var(--black);border-color:var(--amber);}
.btn-primary:hover:not(:disabled){background:#E89300;border-color:#E89300;}
.btn-secondary{background:var(--white);color:var(--black);border-color:var(--black);}
.btn-secondary:hover:not(:disabled){background:var(--faint);}
.btn-ghost{font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;}
.btn-ghost:hover:not(:disabled){color:var(--black);}

.progress-bar{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:14px 20px;margin-bottom:12px;position:sticky;top:72px;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.progress-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
.progress-label{font-weight:700;}
.progress-count{color:var(--muted);}
.progress-track{height:4px;background:var(--faint);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--amber);border-radius:2px;transition:width .3s ease;}

/* NAV HELP */
.nav-help{font-size:11px;color:var(--muted);background:var(--faint);padding:6px 12px;border-radius:4px;margin-bottom:10px;text-align:center;}

.section-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.section-tab{padding:5px 12px;background:var(--white);border:1.5px solid var(--border);border-radius:20px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .1s;display:flex;align-items:center;gap:5px;}
.section-tab.active{background:var(--black);color:var(--white);border-color:var(--black);}
.section-tab.done{border-color:var(--green);color:var(--green);}
.tab-dot{width:5px;height:5px;border-radius:50%;background:var(--border);}
.section-tab.active .tab-dot{background:var(--amber);}
.section-tab.done .tab-dot{background:var(--green);}

/* ANSWER LEGEND */
.ans-legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;padding:9px 14px;background:var(--faint);border-radius:6px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600;}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

.q-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:10px;}
.q-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;}
.q-num{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--faint);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--muted);margin-top:1px;}
.q-num.answered{background:var(--amber);border-color:var(--amber);color:var(--black);}
.q-text{font-size:13px;font-weight:700;line-height:1.5;flex:1;}
.q-ref{font-size:10px;color:var(--muted);font-weight:600;margin-top:4px;}
.q-note{font-size:10px;color:var(--amber);font-weight:700;margin-top:2px;}
.ans-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.ans-btn{padding:9px 4px;border:1.5px solid var(--border);border-radius:4px;font-size:11px;font-weight:700;text-align:center;background:var(--white);color:var(--muted);cursor:pointer;transition:all .1s;line-height:1.3;font-family:inherit;}
.ans-btn:hover{border-color:var(--black);color:var(--black);}
.ans-green{background:var(--green)!important;color:#fff!important;border-color:var(--green)!important;}
.ans-amber{background:var(--amber)!important;color:var(--black)!important;border-color:var(--amber)!important;}
.ans-red{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important;}
.ans-blue{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important;}

/* RAPPORT */
.report-banner{border-radius:var(--r);padding:24px 28px;margin-bottom:14px;background:var(--black);color:var(--white);border-left:5px solid var(--amber);display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px;}
.banner-label{font-size:10px;color:var(--amber);font-weight:800;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
.banner-company{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
.banner-meta{font-size:12px;color:#8A8B91;display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;}
.banner-score-wrap{text-align:right;}
.banner-score-label{font-size:10px;color:#8A8B91;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;}
.banner-score{font-size:52px;font-weight:800;line-height:1;letter-spacing:-2px;}
.banner-score em{color:var(--amber);font-style:normal;}
.banner-readiness{margin-top:6px;}

/* READINESS BADGES */
.readiness-badge{display:inline-block;padding:4px 12px;border-radius:3px;font-size:13px;font-weight:800;letter-spacing:.3px;}
.r-nara{background:#E8F5EE;color:var(--green);}
.r-bit{background:#FFF3DC;color:#7A4800;}
.r-lang{background:#FAEAEA;color:var(--red);}
.r-na{background:var(--faint);color:var(--muted);}

.kpi-row{display:flex;background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden;}
.kpi-cell{flex:1;padding:16px 20px;border-right:1px solid var(--faint);}
.kpi-cell:last-child{border-right:none;}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin-bottom:5px;}
.kpi-value{font-size:15px;font-weight:700;line-height:1.3;}

/* RAPPORT INFO-RUTA */
.report-info-box{background:#EEF4FB;border:1.5px solid #C8DCF0;border-radius:var(--r);padding:18px 22px;margin-bottom:14px;}
.report-info-box h4{font-size:13px;font-weight:800;color:var(--blue);margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.report-info-box p{font-size:12px;color:#1a3a5c;line-height:1.65;margin-bottom:6px;}
.report-info-steps{list-style:none;padding:0;margin:6px 0 0;}
.report-info-steps li{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:#1a3a5c;margin-bottom:5px;line-height:1.5;}

.cert-section{background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px;overflow:hidden;}
.cert-head{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-left:4px solid var(--amber);background:#FFFBF0;}
.cert-head h3{font-size:15px;font-weight:800;margin-bottom:2px;}
.cert-head-reg{font-size:11px;color:var(--muted);}
.cert-head-score{font-size:28px;font-weight:800;letter-spacing:-1px;}
.cert-body{padding:20px;}
.spider-wrap{display:flex;justify-content:center;margin-bottom:6px;}
.spider-caption{text-align:center;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--faint);}
.bar-row{display:flex;align-items:center;gap:10px;padding:5px 0;}
.bar-label{width:200px;font-size:12px;font-weight:600;flex-shrink:0;}
.bar-track{flex:1;height:7px;background:var(--faint);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;border-radius:3px;}
.bar-pct{width:38px;text-align:right;font-size:12px;font-weight:700;}
.bar-section{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--faint);}

/* BEDÖMNING FÖRKLARING */
.readiness-explain{background:var(--faint);border-radius:6px;padding:12px 16px;margin-bottom:16px;font-size:12px;color:var(--muted);line-height:1.65;}
.readiness-explain strong{color:var(--black);font-weight:700;}

.gap-section h4{font-size:13px;font-weight:800;margin-bottom:12px;}
.gap-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--faint);}
.gap-row:first-of-type{border-top:none;padding-top:0;}
.gap-badge{flex-shrink:0;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:2px;margin-top:2px;}
.badge-hi{background:#FAEAEA;color:var(--red);}
.badge-mi{background:#FFF3DC;color:#7A4800;}
.badge-uk{background:#EEF4FB;color:var(--blue);}
.gap-body{flex:1;}
.gap-title{font-weight:700;font-size:13px;margin-bottom:2px;}
.gap-meta{font-size:11px;color:var(--muted);}
.gap-none{text-align:center;padding:12px;font-size:13px;font-weight:700;color:var(--green);}

/* NÄSTA STEG */
.next-steps{background:var(--white);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px;overflow:hidden;}
.next-steps-head{padding:14px 20px;background:#FFFBF0;border-left:4px solid var(--amber);}
.next-steps-head h3{font-size:15px;font-weight:800;}
.next-step-item{display:flex;align-items:flex-start;gap:13px;padding:14px 20px;border-top:1px solid var(--faint);}
.next-step-icon{font-size:20px;flex-shrink:0;margin-top:1px;}
.next-step-body{flex:1;}
.next-step-title{font-size:13px;font-weight:800;margin-bottom:3px;display:flex;align-items:center;gap:8px;}
.next-step-text{font-size:12px;color:var(--muted);line-height:1.65;}
.pri-hog{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:2px;background:#FAEAEA;color:var(--red);}
.pri-medel{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:2px;background:#FFF3DC;color:#7A4800;}

.summary-box{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;margin-bottom:14px;border-left:4px solid var(--amber);}
.summary-box-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--amber);margin-bottom:8px;}
.summary-box-text{font-size:14px;line-height:1.75;color:var(--black);}

.disclaimer{font-size:11px;color:var(--muted);line-height:1.7;margin-top:20px;padding:14px 16px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);border-left:3px solid var(--amber);}
.disclaimer strong{display:block;font-size:10px;color:var(--black);text-transform:uppercase;letter-spacing:.8px;font-weight:800;margin-bottom:6px;}

.cta-block{margin-top:20px;padding:24px 28px;background:var(--white);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.cta-block h3{font-size:18px;font-weight:800;margin-bottom:4px;}
.cta-block p{font-size:13px;color:var(--muted);}
.cta-link{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:var(--black);padding:13px 24px;font-size:13px;font-weight:800;border-radius:4px;white-space:nowrap;border:2px solid var(--amber);font-family:inherit;transition:all .12s;text-decoration:none;}
.cta-link:hover{background:#E89300;border-color:#E89300;}
.print-url{display:none;font-size:10px;color:var(--muted);margin-top:6px;word-break:break-all;}

.gate-wrap{min-height:100vh;background:var(--page);display:flex;align-items:center;justify-content:center;padding:32px 16px;}
.gate-box{background:var(--white);border-radius:var(--r);border:1px solid var(--border);box-shadow:0 4px 24px rgba(0,0,0,.08);padding:40px 36px;max-width:480px;width:100%;}
.gate-logo{height:52px;width:auto;margin-bottom:24px;}
.gate-title{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:8px;}
.gate-sub{font-size:14px;color:var(--muted);margin-bottom:24px;line-height:1.6;}
.gate-form{display:flex;flex-direction:column;gap:14px;}
.gate-field{display:flex;flex-direction:column;gap:6px;}
.gate-label{font-size:13px;font-weight:700;color:var(--black);}
.gate-input{padding:11px 14px;font-size:14px;font-family:inherit;border:1.5px solid var(--border);border-radius:6px;outline:none;transition:border-color .15s,box-shadow .15s;}
.gate-input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,163,0,.14);}
.gate-btn{background:var(--amber);color:var(--black);border:none;border-radius:4px;padding:13px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:4px;transition:background .12s;}
.gate-btn:hover{background:#E89300;}
.gate-btn:disabled{opacity:.5;cursor:not-allowed;}
.gate-error{font-size:12px;color:var(--red);font-weight:600;background:#FAEAEA;padding:10px 14px;border-radius:6px;border:1px solid #f0c0c0;}
.gate-privacy{font-size:11px;color:var(--muted);line-height:1.6;margin-top:10px;padding-top:14px;border-top:1px solid var(--faint);}
.gate-facts{display:flex;gap:8px;margin-bottom:20px;}
.gate-fact{flex:1;background:var(--faint);border-radius:6px;padding:10px 12px;text-align:center;}
.gate-fact-n{font-size:16px;font-weight:800;}
.gate-fact-l{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.gate-success{text-align:center;padding:24px 0;}
.gate-success-icon{width:52px;height:52px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:22px;}
.gate-success h2{font-size:20px;font-weight:800;margin-bottom:8px;}
.gate-success p{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.6;}

.validation-box{margin-top:14px;padding:14px 16px;background:#FEF3E2;border:1px solid #FFD580;border-radius:6px;}
.validation-title{font-size:13px;font-weight:800;margin-bottom:8px;}
.validation-item{display:flex;align-items:center;gap:8px;font-size:13px;color:#7A4800;margin-bottom:4px;}
.v-num{width:20px;height:20px;border-radius:50%;background:var(--amber);color:var(--black);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.modal-overlay{position:fixed;inset:0;background:rgba(16,24,32,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:24px;}
.modal-box{background:var(--white);border-radius:var(--r);padding:32px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.18);}
.modal-icon{font-size:28px;margin-bottom:14px;}
.modal-box h3{font-size:18px;font-weight:800;margin-bottom:8px;}
.modal-box p{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;}

.print-header{display:none;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:14px;border-bottom:3px solid var(--black);}
.print-header-logo{height:64px;width:auto;display:block;}
.print-header-right{text-align:right;}

const TOTAL_Q=SECTIONS.reduce((n,s)=>n+s.questions.length,0);

// Viktad poängberäkning per avsnitt
const secPct=(sec,ans)=>{
  let s=0,maxS=0;
  sec.questions.forEach(q=>{
    const a=ans[q.id];if(!a||a==="vet_ej")return;
    const d=ANSWERS.find(x=>x.key===a);
    const w=WEIGHTS[q.id]||1;
    if(d&&d.score!==null){s+=d.score*w;maxS+=w;}
  });
  return{pct:maxS>0?Math.round(s/maxS*100):null,done:sec.questions.filter(q=>ans[q.id]).length,total:sec.questions.length};
};

// Viktad totalsumma
const allPct=(ans)=>{

    const a=ans[q.id];if(!a||a==="vet_ej")return;
    const d=ANSWERS.find(x=>x.key===a);
    const w=WEIGHTS[q.id]||1;
    if(d&&d.score!==null){s+=d.score*w;maxS+=w;}
  }));
  return maxS?Math.round(s/maxS*100):null;
};

// Generera prioriterade nästa steg baserat på svar
const getNextSteps=(answers)=>{
  const steps=[];
  const hasGap=ids=>ids.some(id=>answers[id]==="ej"||answers[id]==="pagar");
  if(hasGap(["q46_1"]))steps.push({priority:"hög",icon:"🎓",title:"Genomför cybersäkerhetsutbildning för all personal",text:"Utbildning av samtliga medarbetare är ett av de mest tidskrävande kraven. Utbildningen ska täcka lösenord, säkerhetskopiering, e-post, skadlig kod, distansarbete och incidenthantering. Börja planera och genomföra detta tidigt i processen."});
  if(hasGap(["q44_1","q44_2","q44_3","q44_4","q44_5","q44_6"]))steps.push({priority:"hög",icon:"📋",title:"Identifiera kritiska IT-leverantörer och upprätta avtal",text:"Kartlägg vilka leverantörer som är kritiska för er verksamhet och säkerställ deras cybersäkerhet. Upprätta juridiskt bindande avtal och, där GDPR kräver det, personuppgiftsbiträdesavtal (DPA). Förhandling och undertecknande tar ofta tid."});
  if(answers["q453_2"]==="ej"||answers["q453_2"]==="pagar")steps.push({priority:"hög",icon:"🔐",title:"Aktivera multifaktorsautentisering (MFA)",text:"MFA ska aktiveras på alla system där det är tekniskt möjligt — prioritera e-post, administrativa konton och VPN. Kräver teknisk implementation och ofta utbildning av användare."});
  if(hasGap(["q412_1","q412_2","q412_3"]))steps.push({priority:"hög",icon:"💾",title:"Säkerställ säkerhetskopieringsrutin",text:"Se till att information säkerhetskopieras enligt ett dokumenterat beslut, att minst en kopia enbart är åtkomlig för administratörer, och att kopiorna kontrolleras regelbundet med stickprov."});
  if(hasGap(["q411_1","q411_2","q411_3","q411_4","q411_5"]))steps.push({priority:"medel",icon:"🔑",title:"Dokumentera lösenordspolicy och byt standardlösenord",text:"Upprätta ett beslut om lösenordskrav (min. 12 tecken, inga ordlisteord, ingen återanvändning). Säkerställ att alla standardlösenord är bytta på datorer, mobila enheter och nätverksutrustning."});
  if(answers["q433_3"]==="ej"||answers["q433_3"]==="pagar")steps.push({priority:"medel",icon:"🌐",title:"Konfigurera DNSSEC för organisationens domän",text:"DNSSEC skyddar ert domännamn mot manipulation av DNS-svar. Kontakta er DNS-leverantör eller IT-ansvarig — kräver ofta extern hjälp men är en viktig teknisk skyddsnivå."});
  if(hasGap(["q422_1","q422_2"]))steps.push({priority:"medel",icon:"🔄",title:"Säkerställ rutin för säkerhetsuppdateringar",text:"Automatiska säkerhetsuppdateringar ska vara aktiverade för operativsystem, programvaror och nätverksenheter. Enheter som inte längre uppdateras ska tas bort eller isoleras."});
  return steps;
};

function Spider({sections,answers,size=220}){
  const [tooltip,setTooltip]=useState(null);
  const cx=size/2,cy=size/2,R=size*0.30,n=sections.length;
  if(n<3)return null;
  const ang=i=>(i*2*Math.PI/n)-Math.PI/2;
  const pt=(i,r)=>({x:cx+r*Math.cos(ang(i)),y:cy+r*Math.sin(ang(i))});
  const vals=sections.map((s,i)=>{const{pct}=secPct(s,answers);return{name:s.name,v:pct!=null?pct/100:0,i,pct};});
  const dpts=vals.map(({v,i})=>{const p=pt(i,v*R);return p.x+","+p.y;}).join(" ");
  const lR=R*1.42;
  return(
    <svg width={size} height={size} viewBox={"0 0 "+size+" "+size} style={{overflow:"visible"}}>
      {[.25,.5,.75,1].map((lv,j)=>{
        const ps=sections.map((_,i)=>{const p=pt(i,lv*R);return p.x+","+p.y;}).join(" ");
        return <polygon key={j} points={ps} fill="none" stroke="#E8E9EC" strokeWidth={j===3?1.5:1}/>;
      })}
      {vals.map(({i})=>{const e=pt(i,R);return<line key={i} x1={cx} y1={cy} x2={e.x} y2={e.y} stroke="#E8E9EC" strokeWidth="1"/>;})};
      <polygon points={dpts} fill="#FFA300" fillOpacity=".16" stroke="#FFA300" strokeWidth="2" strokeLinejoin="round"/>
      {vals.map(({v,i,name,pct})=>{
        const p=pt(i,v*R);
        return(
          <g key={i} onMouseEnter={()=>setTooltip({x:p.x,y:p.y,name,pct})} onMouseLeave={()=>setTooltip(null)} style={{cursor:"pointer"}}>
            <circle cx={p.x} cy={p.y} r="12" fill="transparent"/>
            <circle cx={p.x} cy={p.y} r="4.5" fill="#FFA300" stroke="#fff" strokeWidth="2"/>
          </g>
        );
      })}
      {vals.map(({name,i})=>{
        const lp=pt(i,lR),cv=Math.cos(ang(i));
        const anchor=cv>.15?"start":cv<-.15?"end":"middle";
        const words=name.split(" ");
        const line1=words.slice(0,Math.ceil(words.length/2)).join(" ");
        const line2=words.slice(Math.ceil(words.length/2)).join(" ");
        return(
          <text key={i} x={lp.x} y={lp.y} textAnchor={anchor} dominantBaseline="middle" fontFamily="Open Sans,sans-serif">
            <tspan x={lp.x} dy={line2?"-0.6em":0} fontSize="9" fontWeight="700" fill="#4A4B52">{line1}</tspan>
            {line2&&<tspan x={lp.x} dy="1.2em" fontSize="9" fontWeight="700" fill="#4A4B52">{line2}</tspan>}
          </text>
        );
      })}
      {[25,50,75].map((v,i)=>{const lp=pt(0,v/100*R);return<text key={i} x={lp.x+3} y={lp.y-2} fontSize="7" fill="#C0C0C0" fontFamily="Open Sans,sans-serif">{v}%</text>;})}
      {tooltip&&(
        <g>
          <rect x={tooltip.x-58} y={tooltip.y-38} width="116" height="32" rx="4" fill="#101820" opacity=".93"/>
          <text x={tooltip.x} y={tooltip.y-26} textAnchor="middle" fontSize="10" fontWeight="700" fill="white" fontFamily="Open Sans,sans-serif">{tooltip.name.length>18?tooltip.name.slice(0,16)+"…":tooltip.name}</text>
          <text x={tooltip.x} y={tooltip.y-13} textAnchor="middle" fontSize="11" fontWeight="800" fill="#FFA300" fontFamily="Open Sans,sans-serif">{tooltip.pct!==null?tooltip.pct+"%":"Vet ej"}</text>
        </g>
      )}
    </svg>
  );
}

                </div>
                <div className="next-step-text">{st.text}</div>
              </div>
            </div>
          ))}
        </div>
      )}
      {steps.length===0&&gaps.length===0&&(
        <div className="next-steps">
          <div className="next-steps-head"><h3>Rekommenderade nästa steg</h3></div>
          <div className="next-step-item">
                        <div className="next-step-body">
              <div className="next-step-title">Ansök om certifiering hos SBSC</div>
              <div className="next-step-text">Er GAP-analys visar att samtliga krav är uppfyllda. Nästa steg är att ansöka om certifiering hos SBSC, fylla i den utförligare egendeklarationen och lämna in bevis på att kraven uppfylls.</div>
            </div>
          </div>
        </div>
      )}

      <div className="disclaimer">
        <strong>Viktig information</strong>
        Denna GAP-analys är en självskattning och ger en indikativ bild av er beredskap mot SSF 1101 Cybersäkerhet Basnivå. Resultaten speglar hur ni tolkar och besvarar frågorna. En hög uppfyllnadsgrad garanterar inte att certifiering utfärdas — certifikat utfärdas då samtliga krav är verifierade av SBSC. Giltighetstid är längst 3 år. SBSC är ackrediterat av SWEDAC (ackrediteringsnummer 1631).
      </div>

      <div className="cta-block">
        <div>
          <h3>Ansök om SSF 1101-certifiering</h3>
          <p>Läs mer om certifieringsprocessen och ansök direkt på SBSC:s webbplats.</p>
        </div>
        <div style={{textAlign:"center"}}>
          <a className="cta-link" href={CERT_URL} target="_blank" rel="noopener noreferrer">
            Ansök om certifiering
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </a>
          <div className="print-url">{CERT_URL}</div>
        </div>
      </div>

      <div className="btn-row no-print" style={{marginTop:20}}>
        <button className="btn-ghost" onClick={back}>← Tillbaka</button>
        <div style={{display:"flex",gap:10}}>
          <button className="btn btn-secondary" onClick={()=>window.print()}>🖨 Skriv ut / PDF</button>
          <button className="btn btn-secondary" onClick={restart}>Börja om</button>
        </div>
      </div>
    </>
  );
}

function StartPage({company,setCompany,agreed,setAgreed,attempted,goStart}){
  const missingName=!company.trim();
  const missingAgreed=!agreed;
  const hasError=attempted&&(missingName||missingAgreed);

  return(
    <>
      <div className="page-intro">
        <div className="chip">SSF 1101 Cybersäkerhet Basnivå</div>
        <h1>Kartlägg er beredskap inför certifiering</h1>
        <p>Gå igenom standardens {TOTAL_Q} krav och få en GAP-analys med bedömning av hur redo er organisation är.</p>
      </div>

      {/* INFORMATIONSRUTA */}
      <div className="info-box">
        <div className="info-box-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A5A8C" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          Vad är det här verktyget?
        </div>
        <div className="info-box-body">
          Det här är ett <strong>förberedelseverktyg</strong> som hjälper er att bedöma hur redo organisationen är för certifiering mot SSF 1101 Cybersäkerhet BAS. Ni svarar på {TOTAL_Q} krav och får en GAP-analys med bedömningen <strong>Nära</strong>, <strong>En bit på väg</strong> eller <strong>Lång kvar</strong>. Bedömningen väger in hur arbetsintensiva kvarvarande krav är — utbildning av all personal och leverantörsavtal väger tyngre än tekniska punktinställningar.
        </div>
        <div className="info-warn-head">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7A3800" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Viktigt: En bra GAP-analys innebär inte att ni är certifierade
        </div>
        <ul className="steps-list">
          <li><span className="step-num">1</span><span>Ansökan hos SBSC</span></li>
          <li><span className="step-num">2</span><span>Ifyllnad av SBSC:s utförligare digitala egendeklaration (tillgänglig efter ansökan)</span></li>
          <li><span className="step-num">3</span><span>Inlämning av bevis på att kraven i SSF 1101 faktiskt uppfylls och verifiering av SBSC</span></li>
        </ul>
        <div className="info-note">Det här verktyget ersätter inte de tre stegen ovan — det ger er en bild av var ni befinner er och vad som återstår att göra.</div>

      </div>

      {/* SSF DOWNLOAD BOX */}
      <div className="ssf-download-box">
        <div className="ssf-download-text">
          <div className="ssf-download-title">Läs standarden innan du börjar</div>
          <div className="ssf-download-body">SSF 1101 är kostnadsfri att ladda ner. Vi rekommenderar att du läser den för att bättre förstå vad certifieringen kräver.</div>
        </div>
        <a className="ssf-download-btn" href="https://www.stoldskyddsforeningen.se/butik/foretag/ssf-normer/cybersakerhet/ssf-1101-utg-2-ssf-cybersakerhet-basniva-grundlaggande-it-sakerhet/" target="_blank" rel="noopener noreferrer">
          Ladda ner SSF 1101 kostnadsfritt
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </a>
      </div>

      <div className="card">
        <div className="field-label">Organisationens namn <span className="req-star">*</span></div>
        <input className="text-input" type="text" placeholder="T.ex. Andersson AB" value={company} onChange={e=>setCompany(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")goStart();}}/>
        <div className="privacy-note">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <p>Ingen data sparas. Alla svar stannar i din webbläsare och raderas när du stänger sidan.</p>
        </div>
        <div className="disc-check-wrap" onClick={()=>setAgreed(a=>!a)}>
          <div className={"disc-checkbox"+(agreed?" disc-checked":"")}>{agreed?"✓":""}</div>
          <div className="disc-check-text">
            <strong>Jag förstår att detta är en GAP-analys — inte ett certifieringsbesked</strong>
            Resultaten är ett stöd för eget förbättringsarbete. En hög uppfyllnadsgrad garanterar inte att certifikat utfärdas utan genomgång av SBSC:s fullständiga certifieringsprocess.
          </div>
        </div>
        {hasError&&(
          <div className="validation-box">
            <div className="validation-title">Följande måste fyllas i:</div>
            {missingName&&<div className="validation-item"><span className="v-num">1</span>Ange organisationens namn</div>}
            {missingAgreed&&<div className="validation-item"><span className="v-num">{missingName?"2":"1"}</span>Bekräfta att du förstår hur GAP-analysen ska användas</div>}
          </div>
        )}
        <div className="stat-row">
          <div className="stat"><div className="stat-n">{TOTAL_Q}</div><div className="stat-l">krav</div></div>
          <div className="stat"><div className="stat-n">6</div><div className="stat-l">avsnitt</div></div>
          <div className="stat"><div className="stat-n">~20 min</div><div className="stat-l">beräknad tid</div></div>
        </div>
        <div className="btn-row">
          <span style={{fontSize:12,color:"var(--muted)"}}>Baserat på SSF 1101 utgåva 2, oktober 2023.</span>
          <button className="btn btn-primary" onClick={goStart}>Starta →</button>
        </div>
      </div>
    </>
  );
}

function App(){
  const [gateCleared,setGateCleared]=useState(false);
  const [view,setView]=useState("start");
  const [answers,setAnswers]=useState({});
  const [secIdx,setSecIdx]=useState(0);
  const [company,setCompany]=useState("");
  const [agreed,setAgreed]=useState(false);
  const [attempted,setAttempted]=useState(false);
  const [showRestart,setShowRestart]=useState(false);

  const answer=(qid,val)=>setAnswers(p=>({...p,[qid]:val}));

  const goStart=()=>{
    setAttempted(true);
    if(!company.trim()||!agreed)return;
    setSecIdx(0);setView("questions");window.scrollTo(0,0);
  };

  const restart=()=>setShowRestart(true);
  const confirmRestart=()=>{
    setAnswers({});setSecIdx(0);setCompany("");setAgreed(false);
    setAttempted(false);setShowRestart(false);setView("start");window.scrollTo(0,0);
  };

  if(!gateCleared)return<GatePage onSuccess={(co)=>{setCompany(co);setGateCleared(true);window.scrollTo(0,0);}}/>;

  return(
    <>
      <header className="site-header no-print">
        <div className="hdr-inner">
          <img src={LOGO} alt="SBSC" className="hdr-logo"/>
          <span className="hdr-label">SSF 1101 Cybersäkerhet Basnivå</span>
        </div>
      </header>
      <main className="shell">
        {view==="start"&&<StartPage company={company} setCompany={setCompany} agreed={agreed} setAgreed={setAgreed} attempted={attempted} goStart={goStart}/>}
        {view==="questions"&&<QPage answers={answers} answer={answer} secIdx={secIdx} setSecIdx={setSecIdx} setView={setView}/>}
        {view==="results"&&<ReportPage answers={answers} company={company} restart={restart} back={()=>{setView("questions");window.scrollTo(0,0);}}/>}
        {showRestart&&(
          <div className="modal-overlay" onClick={()=>setShowRestart(false)}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
              <div className="modal-icon">⚠️</div>
              <h3>Börja om från början?</h3>
              <p>Alla svar raderas permanent. Detta kan inte ångras.</p>
              <div className="modal-btns">
                <button className="btn btn-secondary" onClick={()=>setShowRestart(false)}>Avbryt</button>
                <button className="btn btn-primary" onClick={confirmRestart}>Ja, börja om</button>
              </div>
            </div>
          </div>
        )}
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
